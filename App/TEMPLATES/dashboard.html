{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/book.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="dash">
      <div class="side-bar-l fw-bold text-center">Products</div>

      <div class="side-bar-r">
        <div style="padding-left: 90%; margin: 10px">
          <button
            class="btn btn-success d-flex justify-content-center align-items-center"
            style="height: 30px; width: 100px"
          >
            <i class="fa-solid fa-plus" style="color: rgb(255, 255, 255)"></i
            ><a
              href="{% url 'detail' %}"
              style="text-decoration: none; color: white"
              >Add</a
            >
          </button>
        </div>

        <div>
          <table class="table table-bordered table-danger table-striped w-100">
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>prize</th>
              <th>delete</th>
              <th>update</th>
            </tr>
            {% for data in data %}

            <tr>
              <td>
                {% if data.image %}
                <img
                  src="{{data.image.url}}"
                  alt=" Image"
                  height="60"
                  style="object-fit: cover; border-radius: 5px"
                />
                {% else %}
                <span class="text-muted">No Image</span>
                {% endif %}
              </td>
              <td>{{data.name}}</td>
              <td class="mb-5">{{data.prize}}</td>

              <td>
                <a
                  href="{% url 'delete_Data' data.id %}"
                  class="btn btn-danger"
                >
                  delete data</a
                >
              </td>
              <td>
                <a href="{% url 'update2' data.id %}" class="btn btn-danger">
                  update</a
                >
              </td>
            </tr>

            {% endfor %}
          </table>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
